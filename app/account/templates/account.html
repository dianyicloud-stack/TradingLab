<div class="workspace-form">
<h2>我的组合账户</h2><p>一笔独立资金，多只股票共享。这里切换查看账户，不改变 Live 的执行账户。</p>
<p id="account-message" role="status"></p>
<section class="workspace-panel"><div class="toolbar"><label>查看账户<select id="account-select"></select></label><button id="account-new">新建</button><button id="account-settings">账户设置</button><button id="account-delete">删除</button><button id="account-refresh">刷新估值</button><a href="/live">返回 Live</a></div><p id="account-summary"></p><p id="account-mode"></p><button id="account-pause">暂停新增风险</button></section>
<section class="workspace-panel" id="account-editor" hidden><h3 id="editor-title">新建组合账户</h3><form id="account-form"><div class="toolbar"><label>账户名称<input id="account-name" required maxlength="60"></label><label>初始资金（元）<input id="initial-capital" type="number" min="0.01" max="200000" step="0.01" required></label><label>执行模式<select id="ai-execution"><option value="ADVISORY_ONLY">只给建议</option><option value="OFF">关闭账户自动响应</option><option value="AUTO_SHADOW_EXECUTION">自动影子执行</option></select></label></div>
<div class="toolbar"><label>最多持有股票数<input id="max-open" type="number" min="1" required></label><label>单股仓位上限 %<input id="max-symbol" type="number" min="0" max="100" required></label><label>总仓位上限 %<input id="max-total" type="number" min="0" max="100" required></label><label>最低现金储备 %<input id="cash-reserve" type="number" min="0" max="100" required></label></div><p>自动影子执行模式下，实时自动分析及手动“立即分析”均可能触发模拟成交。历史分析不执行交易。费用、滑点及每日风险限制沿用现有规则。</p><button id="account-save">保存</button><button type="button" id="account-cancel">取消</button></form></section>
<div class="metric-grid" id="account-totals"></div>
<section class="workspace-panel"><h3>持仓</h3><div class="table-scroll"><table><thead><tr><th>股票</th><th>数量 / 可卖 / 锁定</th><th>成本</th><th>现价</th><th>当前仓位</th><th>最新有效目标</th><th>执行情况</th></tr></thead><tbody id="account-positions"></tbody></table></div></section>
<details class="workspace-panel" id="manual-panel"><summary>手工模拟操作</summary><p>人工买入默认受保护，AI 不会自动卖出；仍遵守费用、T+1 和风险限制。</p><form id="manual-form"><div class="toolbar"><label>股票<input id="manual-symbol" required pattern="(sh|sz|bj)[0-9]{6}"></label><label>行动<select id="manual-action"><option value="OPEN">建仓</option><option value="ADD">加仓</option><option value="REDUCE">减仓</option><option value="EXIT">清仓</option></select></label><label>目标仓位 %<input id="manual-target" type="number" min="0" max="100" step="0.1" required></label><label>原因<input id="manual-reason" required></label><button>预览模拟执行</button></div></form><p id="manual-preview"></p><button id="manual-confirm" hidden>确认本次模拟执行</button></details>
<section class="workspace-panel"><h3>最近操作</h3><div id="account-orders"></div></section>
</div>
