project:
  timezone: Asia/Shanghai

action_policy:
  mode: structure_first
  allow_preemptive_exit: true
  exit_confidence_floor: null

ai:
  default_provider: deepseek
  session_provider: null
  providers:
    openai:
      enabled: true
      model: gpt-5.4-mini
      api_key_env: OPENAI_API_KEY
      timeout_seconds: 60
      max_retries: 2
      retry_base_seconds: 1.0
      max_output_tokens: 1600
      structured_outputs: true
      allow_json_fallback: true
      pricing:
        input_per_million: null
        cached_input_per_million: null
        output_per_million: null
    minimax:
      enabled: false
      model: ""
      api_key_env: MINIMAX_API_KEY
    volcengine:
      enabled: false
      model: ""
      api_key_env: VOLCENGINE_API_KEY
    qwen:
      enabled: false
      model: ""
      api_key_env: DASHSCOPE_API_KEY
    deepseek:
      enabled: true
      model: deepseek-v4-pro
      api_key_env: DEEPSEEK_API_KEY
      base_url: https://api.deepseek.com
      timeout_seconds: 90
      max_retries: 2
      retry_base_seconds: 1.0
      max_output_tokens: null
      reasoning_effort: none
      structured_outputs: true
      allow_json_fallback: true
      pricing:
        input_per_million: null
        cached_input_per_million: null
        output_per_million: null

notifications:
  telegram:
    enabled: false
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID

paths:
  event_handoff_schema: schemas/event_handoff.schema.json
  decision_schema: schemas/decision.schema.json
  prompt: prompts/market_analysis_prompt.txt
  jobs: state/jobs.jsonl
  decisions: state/decisions.jsonl
  coordinator_log: logs/coordinator.log
  api_usage: logs/api_usage.jsonl
